name: Build StreamSync arm64-v8a

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: streamsync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify arm64-v8a native libraries
        run: |
          echo "=== Checking jniLibs/arm64-v8a ==="
          ls -lh app/src/main/jniLibs/arm64-v8a/
          test -f app/src/main/jniLibs/arm64-v8a/libffmpegJNI.so || { echo "Missing libffmpegJNI.so"; exit 1; }
          test -f app/src/main/jniLibs/arm64-v8a/libtranslate_jni.so || { echo "Missing libtranslate_jni.so"; exit 1; }
          test -f app/src/main/jniLibs/arm64-v8a/liblanguage_id_l2c_jni.so || { echo "Missing liblanguage_id_l2c_jni.so"; exit 1; }
          echo "All required arm64-v8a libraries verified!"

      - name: Build APK with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Check Gradle build output
        id: check_output
        run: |
          mkdir -p output-apk
          APK_FOUND=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_FOUND" ]; then
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            cp "$APK_FOUND" output-apk/StreamSync-arm64-v8a.apk
            echo "Found Gradle APK: $APK_FOUND"
          else
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
            echo "Gradle direct build did not produce an APK, will use Automated Repack engine"
          fi

      - name: Automated arm64-v8a Engine (Apktool + D8)
        if: steps.check_output.outputs.apk_exists != 'true'
        run: |
          echo "=== Running Automated arm64-v8a Packaging ==="
          sudo apt-get update -y
          sudo apt-get install -y zipalign apksigner

          # Install latest apktool
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

          # If base APK is hosted or present, repack with arm64-v8a libs
          if [ -f base/StreamSync-base.apk ]; then
            apktool d base/StreamSync-base.apk -o apk_unpack -f
            mkdir -p apk_unpack/lib/arm64-v8a
            cp -r app/src/main/jniLibs/arm64-v8a/* apk_unpack/lib/arm64-v8a/
            apktool b apk_unpack -o output-apk/StreamSync-unsigned.apk
            zipalign -v -p 4 output-apk/StreamSync-unsigned.apk output-apk/StreamSync-aligned.apk
            
            # Generate temporary keystore for signing
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out output-apk/StreamSync-arm64-v8a.apk output-apk/StreamSync-aligned.apk
          else
            echo "No base APK found for repack fallback."
          fi

      - name: Inspect generated APK
        run: |
          if [ -f output-apk/StreamSync-arm64-v8a.apk ]; then
            ls -lh output-apk/StreamSync-arm64-v8a.apk
            unzip -l output-apk/StreamSync-arm64-v8a.apk | grep "lib/arm64-v8a" || true
          else
            echo "No APK produced"
          fi

      - name: Upload APK Artifact
        if: hashFiles('output-apk/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-arm64-v8a
          path: output-apk/StreamSync-arm64-v8a.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && hashFiles('output-apk/*.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.88-arm64
          name: "StreamSync v0.1.88 (arm64-v8a)"
          draft: false
          prerelease: false
          files: output-apk/StreamSync-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
