name: Build StreamSync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APKs (ABI Splits)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect Output APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output-apks/ \;
          echo "=== Generated APKs ==="
          ls -lh output-apks/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-Debug-APKs
          path: output-apks/*.apk
          if-no-files-found: error
