name: Build StreamSync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamsync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StreamSync APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APKs (ABI Splits)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Nuvio Smooth TV & Mobile APK (Full Features + arm64-v8a + Leanback)
        run: |
          if [ -f base/StreamSync-base.apk ]; then
            echo "=== Unpacking and Patching Full StreamSync Base APK with Nuvio UI ==="
            sudo apt-get update -y
            sudo apt-get install -y zipalign apksigner wget python3

            wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
            wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
            chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

            apktool d base/StreamSync-base.apk -o apk_unpack -f

            echo "=== Applying Nuvio UI and Performance Patches ==="
            python3 scripts/patch_nuvio_ui.py apk_unpack "$(pwd)"

            echo "=== Rebuilding APK ==="
            apktool b apk_unpack -o nuvio-unsigned.apk
            zipalign -v -p 4 nuvio-unsigned.apk nuvio-aligned.apk

            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out StreamSync-v188-nuvio-arm64-v8a.apk nuvio-aligned.apk
            cp StreamSync-v188-nuvio-arm64-v8a.apk StreamSync-Original-TV-v8a.apk
            cp StreamSync-v188-nuvio-arm64-v8a.apk StreamSync-original-arm64-v8a.apk
          fi

      - name: Collect Output APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output-apks/ \;
          if [ -f StreamSync-v188-nuvio-arm64-v8a.apk ]; then
            cp StreamSync-v188-nuvio-arm64-v8a.apk output-apks/
            cp StreamSync-Original-TV-v8a.apk output-apks/
            cp StreamSync-original-arm64-v8a.apk output-apks/
          fi
          echo "=== All Produced APKs ==="
          ls -lh output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-Debug-APKs
          path: output-apks/*.apk
          if-no-files-found: error
