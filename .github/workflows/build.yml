name: Build StreamSync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamsync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StreamSync APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build StreamSync APKs (arm64-v8a, armeabi-v7a, universal)
        run: |
          if [ -f base/StreamSync-base.apk ]; then
            echo "=== Installing Tools ==="
            sudo apt-get update -y
            sudo apt-get install -y zipalign apksigner wget python3

            wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
            wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
            chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

            echo "=== Decompiling Base APK ==="
            apktool d base/StreamSync-base.apk -o apk_unpack -f

            echo "=== Applying Nuvio UI & Feature Patches ==="
            python3 scripts/patch_nuvio_ui.py apk_unpack "$(pwd)"

            echo "=== Rebuilding APK ==="
            apktool b apk_unpack -o nuvio-unsigned.apk

            echo "=== Generating & Signing 3 Target APKs (v8a, v7a, universal) ==="
            python3 -c "
            import zipfile, os, subprocess

            src = 'nuvio-unsigned.apk'
            keystore = 'signing/streamsync.keystore'
            os.makedirs('output-apks', exist_ok=True)

            variants = {
                'StreamSync-universal.apk': lambda f: True,
                'StreamSync-arm64-v8a.apk': lambda f: not f.startswith('lib/armeabi-v7a/'),
                'StreamSync-armeabi-v7a.apk': lambda f: not f.startswith('lib/arm64-v8a/')
            }

            with zipfile.ZipFile(src, 'r') as zin:
                for name, predicate in variants.items():
                    unsigned = f'unsigned-{name}'
                    aligned = f'aligned-{name}'
                    final = os.path.join('output-apks', name)
                    
                    with zipfile.ZipFile(unsigned, 'w') as zout:
                        for item in zin.infolist():
                            if item.filename.startswith('META-INF/'):
                                continue
                            if not predicate(item.filename):
                                continue
                            data = zin.read(item.filename)
                            zinfo = zipfile.ZipInfo(item.filename)
                            zinfo.date_time = item.date_time
                            zinfo.external_attr = item.external_attr
                            if item.filename.startswith('lib/') or item.filename == 'resources.arsc':
                                zinfo.compress_type = zipfile.ZIP_STORED
                            else:
                                zinfo.compress_type = item.compress_type
                            zout.writestr(zinfo, data)
                            
                    subprocess.run(['zipalign', '-f', '-p', '4', unsigned, aligned], check=True)
                    subprocess.run([
                        'apksigner', 'sign',
                        '--ks', keystore,
                        '--ks-pass', 'pass:streamsync',
                        '--key-pass', 'pass:streamsync',
                        '--ks-key-alias', 'streamsync',
                        '--v1-signing-enabled', 'true',
                        '--v2-signing-enabled', 'true',
                        '--v3-signing-enabled', 'true',
                        '--out', final,
                        aligned
                    ], check=True)
                    subprocess.run(['apksigner', 'verify', '--verbose', final], check=True)
                    print(f'Successfully built and signed {final} ({os.path.getsize(final)} bytes)')
            "
          fi

      - name: Inspect Output APKs
        run: |
          echo "=== All Produced APKs ==="
          ls -lh output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.1"
          echo "=== Publishing Release $TAG ==="
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output-apks/StreamSync-arm64-v8a.apk output-apks/StreamSync-armeabi-v7a.apk output-apks/StreamSync-universal.apk --clobber
          else
            gh release create "$TAG" output-apks/StreamSync-arm64-v8a.apk output-apks/StreamSync-armeabi-v7a.apk output-apks/StreamSync-universal.apk \
              --title "AioStream v2.0.1 (Addon Stream Isolation, Hidden Streams on Meta, Bluray Remux OOM Fix)" \
              --notes "Bản phát hành chính thức AioStream v2.0.1:
              - Khắc phục cơ chế gọi luồng stream của Addon (Addon Stream Scoping & Isolation):
                + Khi chọn xem phim/tập phim từ catalog của một addon riêng biệt, StreamSync chỉ gọi và trả về duy nhất luồng stream của chính addon sở hữu mục đó, không còn bị trộn lẫn hoặc gọi tràn lan tất cả các community addon khác như Torrentio.
                + Các mục từ Cinemeta hoặc tìm kiếm chung vẫn truy vấn toàn bộ các addon stream đã cài đặt như bình thường.
              - Tối ưu giao diện trang Meta (Ẩn luồng stream trước khi chọn xem):
                + Trang chi tiết Meta cho cả phim lẻ và phim bộ không còn hiển thị và load trước danh sách luồng stream gây chậm màn hình và rối giao diện.
                + Phim lẻ: Bổ sung nút 'Xem phim' nổi bật tại thanh hành động; khi bấm xem mới hiển thị danh sách chọn luồng phát (hoặc mở luồng). Nút sau đó chuyển thành 'Xem trailer' để xem trailer trong app.
                + Phim bộ: Luồng stream chỉ được kích hoạt và hiển thị khi người dùng bấm chọn một tập phim cụ thể trong danh sách tập.
                + Thoát ra hoặc đổi phim sẽ tự động ẩn lại danh sách luồng stream.
              - Khắc phục triệt để lỗi crash app khi xem phim Bluray Remux dung lượng lớn (Java Heap vs Native Buffer OOM):
                + Đối chiếu chuẩn cơ chế Nuvio Mobile: Cố định trần bộ đệm Java Heap an toàn cho Media3 DefaultAllocator ở mức an toàn (tối đa 220MB, 70% Java heap limit), loại bỏ việc đặt bộ đệm lên tới 1024MB - 2048MB (RAM/4) từng gây tràn ART Dalvik Heap dẫn đến OutOfMemoryError và crash SIGABRT trên các phim Remux 60GB - 80GB bitrate cao.
                + Thiết lập prioritizeTimeOverSizeThresholds=true giúp ExoPlayer dừng đệm khi đã nạp đủ thời lượng video (35-50 giây) thay vì cố đệm tràn hàng Gigabyte bộ nhớ.
              - Đầy đủ 3 phiên bản: arm64-v8a, armeabi-v7a và universal.
              - Cập nhật OTA trực tiếp trong ứng dụng cho phiên bản v2.0.1.
              - Keystore cố định hỗ trợ cài đè trực tiếp lên phiên bản cũ không mất dữ liệu." \
              --latest
          fi
