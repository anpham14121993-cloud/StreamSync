name: Build StreamSync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamsync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StreamSync APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APKs (ABI Splits)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Nuvio Smooth TV & Mobile APK (Full Features + arm64-v8a + Leanback)
        run: |
          if [ -f base/StreamSync-base.apk ]; then
            echo "=== Unpacking and Patching Full StreamSync Base APK with Nuvio UI ==="
            sudo apt-get update -y
            sudo apt-get install -y zipalign apksigner wget python3

            wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
            wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
            chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

            apktool d base/StreamSync-base.apk -o apk_unpack -f

            echo "=== Applying Nuvio UI and Performance Patches ==="
            python3 scripts/patch_nuvio_ui.py apk_unpack "$(pwd)"

            echo "=== Rebuilding APK ==="
            apktool b apk_unpack -o nuvio-unsigned.apk

            echo "=== Ensuring all shared libraries in lib/ are stored UNCOMPRESSED ==="
            python3 -c "
            import zipfile, os
            temp_apk = 'nuvio-unsigned-stored.apk'
            with zipfile.ZipFile('nuvio-unsigned.apk', 'r') as zin, zipfile.ZipFile(temp_apk, 'w') as zout:
                for item in zin.infolist():
                    data = zin.read(item.filename)
                    if item.filename.startswith('lib/') or item.filename == 'resources.arsc':
                        zinfo = zipfile.ZipInfo(item.filename)
                        zinfo.compress_type = zipfile.ZIP_STORED
                        zinfo.date_time = item.date_time
                        zinfo.external_attr = item.external_attr
                        zout.writestr(zinfo, data)
                    else:
                        zout.writestr(item, data)
            os.replace(temp_apk, 'nuvio-unsigned.apk')
            print('Successfully stored lib/*.so as ZIP_STORED!')
            "

            zipalign -v -p 4 nuvio-unsigned.apk nuvio-aligned.apk

            apksigner sign --ks signing/streamsync.keystore --ks-pass pass:streamsync --key-pass pass:streamsync --ks-key-alias streamsync --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out StreamSync-v189-nuvio-arm64-v8a.apk nuvio-aligned.apk
            apksigner verify --verbose StreamSync-v189-nuvio-arm64-v8a.apk
            cp StreamSync-v189-nuvio-arm64-v8a.apk StreamSync-v188-nuvio-arm64-v8a.apk
            cp StreamSync-v189-nuvio-arm64-v8a.apk StreamSync-Original-TV-v8a.apk
            cp StreamSync-v189-nuvio-arm64-v8a.apk StreamSync-original-arm64-v8a.apk
          fi

      - name: Collect Output APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output-apks/ \;
          if [ -f StreamSync-v189-nuvio-arm64-v8a.apk ]; then
            cp StreamSync-v189-nuvio-arm64-v8a.apk output-apks/
            cp StreamSync-v188-nuvio-arm64-v8a.apk output-apks/
            cp StreamSync-Original-TV-v8a.apk output-apks/
            cp StreamSync-original-arm64-v8a.apk output-apks/
          fi
          echo "=== All Produced APKs ==="
          ls -lh output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-Debug-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.8.9"
          echo "=== Publishing Release $TAG ==="
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output-apks/StreamSync-v189-nuvio-arm64-v8a.apk output-apks/StreamSync-original-arm64-v8a.apk output-apks/StreamSync-Original-TV-v8a.apk --clobber
          else
            gh release create "$TAG" output-apks/StreamSync-v189-nuvio-arm64-v8a.apk output-apks/StreamSync-original-arm64-v8a.apk output-apks/StreamSync-Original-TV-v8a.apk \
              --title "StreamSync v1.8.9 (Nuvio Smooth UI & Full Codecs)" \
              --notes "Bản phát hành StreamSync v1.8.9:
              - Sửa lỗi cử chỉ vuốt quay lại: chỉ hiện hộp thoại xác nhận thoát ở màn hình Home (catalog), các màn hình khác quay lại trang trước bình thường.
              - Cài đặt Trình phát: mặc định ưu tiên bộ giải mã thiết bị (PREFER_DEVICE).
              - Tích hợp mục Tài khoản & Đồng bộ Supabase từ Nuvio Mobile.
              - Gộp DNS và ByeDPI vào mục Tích hợp.
              - Bổ sung cơ chế Cập nhật ứng dụng tự động kết nối Repo StreamSync.
              - Sử dụng Keystore cố định hỗ trợ cài đè lên các bản cũ mà không bị lỗi gói xung đột." \
              --latest
          fi
