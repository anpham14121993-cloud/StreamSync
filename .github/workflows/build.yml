name: Build StreamSync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamsync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StreamSync APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build StreamSync APKs (arm64-v8a, armeabi-v7a, universal)
        run: |
          if [ -f base/StreamSync-base.apk ]; then
            echo "=== Installing Tools ==="
            sudo apt-get update -y
            sudo apt-get install -y zipalign apksigner wget python3

            wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
            wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
            chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

            echo "=== Decompiling Base APK ==="
            apktool d base/StreamSync-base.apk -o apk_unpack -f

            echo "=== Applying Nuvio UI & Feature Patches ==="
            python3 scripts/patch_nuvio_ui.py apk_unpack "$(pwd)"

            echo "=== Rebuilding APK ==="
            apktool b apk_unpack -o nuvio-unsigned.apk

            echo "=== Generating & Signing 3 Target APKs (v8a, v7a, universal) ==="
            python3 -c "
            import zipfile, os, subprocess

            src = 'nuvio-unsigned.apk'
            keystore = 'signing/streamsync.keystore'
            os.makedirs('output-apks', exist_ok=True)

            variants = {
                'StreamSync-universal.apk': lambda f: True,
                'StreamSync-arm64-v8a.apk': lambda f: not f.startswith('lib/armeabi-v7a/'),
                'StreamSync-armeabi-v7a.apk': lambda f: not f.startswith('lib/arm64-v8a/')
            }

            with zipfile.ZipFile(src, 'r') as zin:
                for name, predicate in variants.items():
                    unsigned = f'unsigned-{name}'
                    aligned = f'aligned-{name}'
                    final = os.path.join('output-apks', name)
                    
                    with zipfile.ZipFile(unsigned, 'w') as zout:
                        for item in zin.infolist():
                            if item.filename.startswith('META-INF/'):
                                continue
                            if not predicate(item.filename):
                                continue
                            data = zin.read(item.filename)
                            zinfo = zipfile.ZipInfo(item.filename)
                            zinfo.date_time = item.date_time
                            zinfo.external_attr = item.external_attr
                            if item.filename.startswith('lib/') or item.filename == 'resources.arsc':
                                zinfo.compress_type = zipfile.ZIP_STORED
                            else:
                                zinfo.compress_type = item.compress_type
                            zout.writestr(zinfo, data)
                            
                    subprocess.run(['zipalign', '-f', '-p', '4', unsigned, aligned], check=True)
                    subprocess.run([
                        'apksigner', 'sign',
                        '--ks', keystore,
                        '--ks-pass', 'pass:streamsync',
                        '--key-pass', 'pass:streamsync',
                        '--ks-key-alias', 'streamsync',
                        '--v1-signing-enabled', 'true',
                        '--v2-signing-enabled', 'true',
                        '--v3-signing-enabled', 'true',
                        '--out', final,
                        aligned
                    ], check=True)
                    subprocess.run(['apksigner', 'verify', '--verbose', final], check=True)
                    print(f'Successfully built and signed {final} ({os.path.getsize(final)} bytes)')
            "
          fi

      - name: Inspect Output APKs
        run: |
          echo "=== All Produced APKs ==="
          ls -lh output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.9.6"
          echo "=== Publishing Release $TAG ==="
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output-apks/StreamSync-arm64-v8a.apk output-apks/StreamSync-armeabi-v7a.apk output-apks/StreamSync-universal.apk --clobber
          else
            gh release create "$TAG" output-apks/StreamSync-arm64-v8a.apk output-apks/StreamSync-armeabi-v7a.apk output-apks/StreamSync-universal.apk \
              --title "AioStream v1.9.6 (Fix Native SIGSEGV/SIGABRT on Large Movies via Standard Media3 FFmpeg Libs)" \
              --notes "Bản phát hành chính thức AioStream v1.9.6:
              - Chuẩn 3 phiên bản duy nhất: arm64-v8a, armeabi-v7a và universal.
              - Khắc phục triệt để lỗi sập native (SIGSEGV/SIGABRT trong thư viện .so) khi mở phim dung lượng lớn:
                + Thay thế thư viện libffmpegJNI.so trên arm64-v8a và armeabi-v7a bằng bản chuẩn AndroidX Media3 (ExoPlayer) 16KB page-aligned từ Jellyfin.
                + Sửa tận gốc nguyên nhân gây sập native SIGSEGV: thư viện libffmpegJNI.so arm64 cũ lấy từ nhánh Nuvio có chữ ký JNI C++ (ffmpegInitialize 8 tham số, ffmpegDecode 9 tham số) không tương thích với mã Java của StreamSync (5 tham số và 6 tham số), dẫn đến lỗi đọc sai vùng nhớ và sập native khi phát các phim dung lượng lớn dùng định dạng âm thanh TrueHD, DTS, DTS-HD MA, EAC3-JOC.
                + Bản thư viện mới tương thích 100% với mã smali Media3, hỗ trợ đầy đủ giải mã DTS, TrueHD, AC3, EAC3, FLAC, Opus mượt mà không crash.
              - Bảo toàn đầy đủ tất cả các tính năng đã hoàn thiện:
                + Sửa triệt để VerifyError trong các lambda (AccountClickLambda, UpdaterClickLambda, AddonToggle, AddonConfig).
                + Tự động đồng bộ tài khoản ngầm mượt mà không khóa SQLite (WAL mode).
                + Hỗ trợ quét mã QR đăng nhập trên TV và D-pad navigation.
                + Nút bật/tắt và cấu hình riêng cho từng addon.
                + Xem trailer phim bộ & phim lẻ in-app (TrailerPlayerActivity).
                + Lấy đầy đủ danh sách tập phim bộ catalog.
                + Căn giữa 1 hàng tên app 'AioStream v1.9.6' ở chân trang cài đặt.
                + Cập nhật OTA trực tiếp trong ứng dụng cho phiên bản v1.9.6.
              - Keystore cố định hỗ trợ cài đè trực tiếp lên phiên bản cũ không mất dữ liệu." \
              --latest
          fi
